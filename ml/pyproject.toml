[project]
name = "ishvenom-ml"
version = "0.1.0"
description = "Training pipelines, dataset builders, and evaluation for IshVenom."
authors = [{ name = "Kwakye Ishmael Affum (Calyx Ish)" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "datasets>=2.21.0",
  "huggingface-hub>=0.25.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pillow>=10.4.0",
  "pydantic>=2.9.0",
  "requests>=2.32.0",
  "typer>=0.12.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
training = [
  "torch>=2.4.0",
  "transformers>=4.45.0",
  "peft>=0.13.0",
  "trl>=0.11.0",
  "bitsandbytes>=0.44.0",
  "accelerate>=1.0.0",
  "unsloth>=2024.10",
  "wandb>=0.18.0",
  "timm>=1.0.0",
  "albumentations>=1.4.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.setuptools]
packages = ["datasets", "train", "training"]
